[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tetirua-guia"
version = "0.1.0"
description = "Componentes locais de STT e TTS para o projeto Tetiruã."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Equipe Tetiruã" }
]
dependencies = []

[project.optional-dependencies]
tts = [
  "kokoro>=0.9.4",
  "soundfile>=0.12.1"
]
stt-moonshine = [
  "moonshine-voice>=0.1.3"
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6"
]

[tool.setuptools.packages.find]
include = ["stt*", "tts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
